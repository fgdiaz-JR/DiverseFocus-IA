---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-inference
  namespace: diversefocus
  labels:
    app: ai-inference
    version: "1.0.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-inference
  template:
    metadata:
      labels:
        app: ai-inference
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: ai-inference
          image: ghcr.io/fgdiaz-jr/diversefocus-ia/ai-inference:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8001
              protocol: TCP
          envFrom:
            - secretRef:
                name: diversefocus-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 20
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: ai-inference
  namespace: diversefocus
  labels:
    app: ai-inference
spec:
  type: ClusterIP
  selector:
    app: ai-inference
  ports:
    - name: http
      protocol: TCP
      port: 8001
      targetPort: 8001
