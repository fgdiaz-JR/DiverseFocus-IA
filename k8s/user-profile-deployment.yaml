---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: user-profile-data
  namespace: diversefocus
  labels:
    app: user-profile
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-profile
  namespace: diversefocus
  labels:
    app: user-profile
    version: "1.0.0"
spec:
  replicas: 1
  strategy:
    type: Recreate  # Required because SQLite supports only one writer
  selector:
    matchLabels:
      app: user-profile
  template:
    metadata:
      labels:
        app: user-profile
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: user-profile
          image: ghcr.io/fgdiaz-jr/diversefocus-ia/user-profile:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8003
              protocol: TCP
          envFrom:
            - secretRef:
                name: diversefocus-secrets
          env:
            - name: DATABASE_URL
              value: "sqlite+aiosqlite:///./data/users.db"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: user-data
              mountPath: /app/data
          livenessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
      volumes:
        - name: user-data
          persistentVolumeClaim:
            claimName: user-profile-data
---
apiVersion: v1
kind: Service
metadata:
  name: user-profile
  namespace: diversefocus
  labels:
    app: user-profile
spec:
  type: ClusterIP
  selector:
    app: user-profile
  ports:
    - name: http
      protocol: TCP
      port: 8003
      targetPort: 8003
